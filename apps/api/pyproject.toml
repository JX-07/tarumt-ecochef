[project]
name = "ecochef-api"
version = "0.0.0"
description = "EcoChef FastAPI backend"
requires-python = ">=3.10"
dependencies = [
  "email-validator>=2.0,<3.0",
  "firebase-admin>=6.5,<7.0",
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "stripe>=16.0,<17.0",
  "uvicorn[standard]>=0.30,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uvicorn]
factory = false
